[package]
name = "open-msi-control"
description = "Fan, performance and battery control for MSI laptops — an open replacement for MSI Center"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "open-msi-control"
path = "src/main.rs"
# The binary embeds a requireAdministrator manifest; its (empty) test harness could not start
# unelevated. All tests live in the library target.
test = false

[dependencies]
msi-acpi.workspace = true
gpui.workspace = true
anyhow.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
flume = "0.11"
raw-window-handle = "0.6"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
