[package]
name = "msi-acpi"
description = "Read and control MSI laptop firmware (fans, performance modes, battery) through the MSI_ACPI WMI interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }

[features]
# Serialize/Deserialize for model types (the app persists profiles with it).
serde = ["dep:serde"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }

[lints]
workspace = true
