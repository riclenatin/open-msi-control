name: Bug report
description: Something in the app is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual result. Screenshots help.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and EC firmware
      description: Shown in the app header, e.g. "Cyborg 15 A12VF · EC 15K1IMS1.113".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
