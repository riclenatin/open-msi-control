name: Support a new laptop model
description: Your MSI laptop is not detected or a feature behaves differently.
labels: [new-model]
body:
  - type: input
    id: model
    attributes:
      label: Model
      description: Marketing name and board, e.g. "Cyborg 15 A12VF (MS-15K1)".
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: msi-probe output
      description: |
        Run `msi-probe.exe` from an elevated terminal and paste the full output.
        It only reads; nothing is written to the firmware.
      render: text
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What does not work?
      description: Which feature, what you expected, what happened.
    validations:
      required: true
